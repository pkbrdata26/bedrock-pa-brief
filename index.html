aiInitiatives: "Clearwater completed its take-private on June 25, 2026 at about $8.4B, led by Permira and Warburg Pincus with Francisco Partners and Temasek. CEO Sandeep Sahai said going private makes it easier to scale the platform while building a Gen AI agentic platform. At Clearwater Connect 2026 the company said nearly 900 clients run agentic workflows in production.\n\nThe platform is a single, continuously reconciled investment record across portfolio management, trading, accounting, risk and compliance, and Clearwater is integrating Enfusion and Beacon onto it. Its security team was profiled in 2025 for blocking shadow AI with an enterprise browser.", 
worldRightNow: "Newly private, investing heavily in AI. Holds data for institutional investors managing more than $10T. Integrating two acquired platforms.",

aiInitiatives: "Wells Fargo expanded its Google Cloud partnership in August 2025 to give every employee, from tellers to investment bankers, AI agents through Google Agentspace. Early agents handle FX post-trade inquiries, policy navigation and contract work across hundreds of thousands of vendor documents. Engineering teams from both companies designed the platform to fit the bank's governance and risk framework.\n\nPublic descriptions of the architecture say sensitive customer data does not reach external models: the bank uses tokenization, small language models for PII detection, and orchestration layers that filter data before and after AI processing. The bank also hired a former AWS executive to lead AI strategy.", 
worldRightNow: "One of the largest enterprise agent rollouts in US banking. Hybrid cloud across Azure, GCP and private cloud. Heavy regulatory oversight.", 
painPoints: [ 
"PII filtering at the model boundary only works if the data was classified correctly upstream, across petabytes.", 
"Agents moving across internal systems create new access paths that cybersecurity must see and control.", 
"Engineering teams want tooling that integrates cleanly into existing CSPM and data pipelines rather than another console.", 
],

angle: "Ben wrote Glooko's 2026 prediction on AI-driven cyberattacks against healthcare data. Glooko pulls data from 200+ diabetes devices into one platform used in 8,000+ clinics across the US and Europe.", 
whoTheyAre: [ 
"CISSP with 30+ years building security, IT and enterprise software teams from the ground up. Calls himself a turnaround leader. At Glooko since 2021, running worldwide security and IT operations.", 
"At Glooko he got HITRUST r2, SOC 2 Type 2, SOC 3 and ISO 27001 in under two years, securing data for more than 4.5M patients, on a security budget under $1M a year. Expect him to value efficiency.", 
"Contributed Glooko's 2026 outlook on \"securing the digital health ecosystem to thwart AI-driven cyberattacks.\"", 
], 
aiInitiatives: "Glooko centralizes data from more than 200 diabetes devices (meters, insulin pumps, CGMs) for millions of patients and 8,000+ clinics. In 2026 it added the Roche Accu-Chek SmartGuide CGM (with predictive AI), Tandem cloud connectivity, EHR integration through Xealth, became mylife Diabetes Care's primary data platform, and launched GestationalCare for high-risk pregnancy.\n\nIt has grown by acquisition, including German medical AI company xbird, Paris-based DIABNEXT and Monarch Medical (2025). Its clinical messaging stresses integrated data, connected devices and AI-enabled insights.", 
worldRightNow: "Small security team, fast-growing integration surface, and both HIPAA and GDPR in scope through the US and Swedish entities.", 
painPoints: [ 
"Every new device or EHR integration is another stream of PHI landing in the platform.", 
"Acquired companies bring their own data stores that need to be found and classified.", 
"Running security and IT ops together means limited time for manual data discovery.", 
],

aiInitiatives: "Snap provides lease-to-own, loans and Seen credit cards to consumers with limited credit, accepted at more than 300,000 merchants and serving 7M+ consumers. It describes its credit modeling as proprietary and AI driven, and partners with Affirm on pay-over-time options.\n\nOn October 21, 2026, seventeen state attorneys general announced a settlement requiring $662M in lease forgiveness and banning misleading credit-score claims, same-as-cash slogans and hidden lease terms.",

"Post-settlement compliance programs tend to unlock budget for data governance.",

angle: "Altera filed confidentially for an IPO in September, and its GRC team is implementing ISO 42001 (AI management) alongside ISO 27001, GDPR and CMMC. IPO readiness plus an AI management standard is a rare combination.", 
whoTheyAre: [ 
"Promoted to Head of GRC at Altera in May 2026, after joining as Senior Manager, InfoSec in August 2025.", 
"Previously 10+ years at Walmart Global Tech, most recently leading third-party security risk across Walmart's global vendor ecosystem (NIST CSF based risk ranking and continuous monitoring).", 
"Member of the AIUC-1 Consortium since August 2026, a group of security, risk and legal leaders defining how enterprises adopt AI agents securely. A natural opening for an AI governance conversation.", 
], 
aiInitiatives: "Silver Lake bought 51% of Altera from Intel (closed September 2025, about $8.75B valuation) and Altera now runs as the largest independent FPGA company. It filed confidentially for a US IPO in September 2026 that could raise over $2B, with Barclays, Citi, JPMorgan and Morgan Stanley underwriting, and added two independent directors.\n\nAltera's GRC job posts ask for ownership of ISO/IEC 27001, ISO/IEC 42001, GDPR, CCPA/CPRA and CMMC, a risk-based GRC architecture aligned to NIST, and AI-assisted compliance tooling. Product messaging centers on FPGAs for edge and physical AI.", 
worldRightNow: "Standing up public company controls (SOX, SEC cyber disclosure) on a short timeline after separating from Intel. Defense customers bring CMMC.", 
painPoints: [ 
"ISO 42001 needs an inventory of AI systems and the data they use. Most teams do not have it.", 
"Separating from Intel's IT means rebuilding data inventories and controls from scratch.", 
"SEC cyber disclosure after IPO raises the bar on documenting data risk.", 
],

angle: "Salesforce told customers in September that frontier AI has changed the rules of cyberattacks, and it has been forcing stronger security settings across every org since June. Kashish works on AI security inside the company running Agentforce on customer CRM data.", 
whoTheyAre: [ 
"Sourced by Bedrock. AI Security Lead at Salesforce since November 2025 (\"securing data and AI\").", 
"Builder of security programs from zero: Head of Security for Microsoft's MileIQ division, Security Lead at Brex, then founder and CEO of Emigre (YC W22), a security consultancy for startups. Forbes Technology Council member.", 
"Carnegie Mellon alum. Has spoken at LASCon, ToorCon and CactusCon. Calls himself a \"failed startup founder\" in his headline, so expect a candid conversation.",

aiInitiatives: "Agentforce runs AI agents on customer CRM data behind the Einstein Trust Layer, with prompt injection detection, data masking and zero retention with model providers. Researchers have documented indirect prompt injection and data exfiltration risks in Agentforce and how Salesforce mitigates them.\n\nIn June 2026 Salesforce began enforcing stronger security configurations across all customer orgs. On September 3, 2026 it published how frontier AI models changed its security program, including agentic AI in its cybersecurity operations center for continuous detection and response.", 
worldRightNow: "Agentforce adoption at scale. Customers asking hard questions about what agents can access.", 
painPoints: [ 
"Agents acting on CRM data need sensitivity context that most customer orgs never labeled.", 
"Prompt injection risk grows with every data source an agent can read.", 
"Shared responsibility: Salesforce secures the platform, but customer data classification sits with the customer.", 
],

angle: "Reveleer's own 2026 report says AI adoption in value-based care has outpaced the governance to defend it: only 35% have a process to detect when AI is wrong. Its EVE Hybrid AI runs on Gemini and Vertex AI over clinical records for 12M covered lives.", 
whoTheyAre: [ 
"New in seat: joined Reveleer in June 2026 as Head of Privacy, Compliance, Security and Technology. Calls himself a global CIO/CISO/CTO focused on AI innovation and security-first engineering.", 
"Previously Head of Global IT & Security at Episource, a UnitedHealth company (99.99% platform availability SLA).", 
"Well networked in the security investor world: advisory boards at Glilot Capital, Craft Ventures and Cyberstarts, and program advisor for Dominican University's MS in Cybersecurity.", 
"Evanta San Francisco CISO community governing body member. Started as a software developer and likes to ask \"why.\" Tells the story of causing his first \"data breach\" in his family's restaurant.", 
"Avid scuba diver and triathlete.",

aiInitiatives: "Reveleer provides risk adjustment, quality and member management for health plans and risk-bearing providers. In January 2026 it launched EVE Hybrid AI for prospective risk adjustment on Google Cloud (Gemini and Vertex AI), and in April a Clinical Data Repository: one AI-enriched clinical record per member reused across risk, quality, audit and care management.\n\nIts 2026 State of Technology in Value-Based Care report (with Mathematica) found AI adoption has outpaced operational readiness. CEO Jay Ackerman argues the audit will show which AI was ready.", 
worldRightNow: "Centralizing PHI into one repository and running GenAI on it, in a market facing tougher Medicare Advantage RADV audits.", 
painPoints: [ 
"A unified clinical data repository concentrates PHI risk in one place.", 
"Audit-defensible AI needs traceability from AI output back to the source record.", 
"Hybrid AI on Google Cloud means PHI flows into managed model services.",

<script>const PAL = [
["#8D5FFF","#000934"], ["#C2B4FC","#000934"], ["#ACC2DD","#000934"],
["#A0E1E1","#000934"], ["#FFC091","#000934"], ["#FFD7EF","#000934"],
];
const SEGS = {
health:   "Healthcare & Life Sci",
fin:      "Financial Services",
semi:     "Semis & Hardware",
software: "Software & AI",
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function paletteFor(name) {
let h = 0;
for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % PAL.length;
return PAL[Math.abs(h)];
}
function initials(name) {
return name.replace(/[^A-Za-z ]/g, "").split(" ").filter(Boolean).filter((w, i, a) => i === 0 || i === a.length - 1).map(w => w[0]).join("").toUpperCase();
}
function avatar(p, size) {
const [bg, fg] = paletteFor(p.name);
const fs = size > 55 ? 24 : 14;
const inner = p.photo
? `<img src="${p.photo}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover;">`
: `<span style="color:${fg};font-size:${fs}px;">${initials(p.name)}</span>`;
return `<div class="av" style="width:${size}px;height:${size}px;background:${bg};">${inner}</div>`;
}
const STACK = { aws: "AWS", azure: "Azure", gcp: "GCP", snowflake: "Snowflake", databricks: "Databricks" };
function stackBadges(stack) {
return Object.keys(STACK).map(k => `<span class="sb${stack && stack[k] ? " on" : ""}">${STACK[k]}</span>`).join("");
}
function tags(p) {
return [
`<span class="tg seg">${SEGS[p.seg]}</span>`,
p.sf      ? `<span class="tg sf">Joined us in SF</span>` : "",
p.sourced ? `<span class="tg src">Sourced by Bedrock</span>` : "",
p.pending ? `<span class="tg pend">Not yet approved</span>` : "",
].join("");
}
PEOPLE.sort((a, b) => a.company.localeCompare(b.company) || a.name.localeCompare(b.name));
document.getElementById("hsub").textContent = `${EVENT.sub.split(" · ")[0]} · ${PEOPLE.length} guests · ${EVENT.sub.split(" · ")[1]}`;
let filterKey = "all";
let query = "";
function matches(p) {
if (filterKey === "sf" && !p.sf) return false;
if (SEGS[filterKey] && p.seg !== filterKey) return false;
if (query) {
const hay = (p.name + " " + p.company + " " + p.title).toLowerCase();
if (!hay.includes(query)) return false;
}
return true;
}
function renderFilters() {
const opts = [["all", "All", PEOPLE.length]]
.concat(Object.keys(SEGS).map(k => [k, SEGS[k], PEOPLE.filter(p => p.seg === k).length]))
.concat([["sf", "Joined us in SF", PEOPLE.filter(p => p.sf).length]]);
document.getElementById("fbar").innerHTML = opts.map(([k, label, n]) =>
`<button class="fb${k === filterKey ? " on" : ""}" onclick="applyFilter('${k}')">${label}<span class="cnt">${n}</span></button>`
).join("");
}
function applyFilter(k) { filterKey = k; renderFilters(); renderOverview(); }
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderOverview(); });
function truncate(text, n) {
const w = (text || "").split(/\s+/);
return w.length <= n ? text : w.slice(0, n).join(" ") + "…";
}
function renderOverview() {
const list = PEOPLE.filter(matches);
document.getElementById("og").innerHTML = list.length ? list.map(p => {
const id = PEOPLE.indexOf(p);
return `
<div class="oc${p.sf ? " rel" : ""}" onclick="openDetail(${id})">
<div class="otop">
${avatar(p, 44)}
<div class="onb">
<div class="oname">${esc(p.name)}</div>
<div class="oco">${esc(p.company)}</div>
</div>
</div>
<div class="otit">${esc(p.title)}</div>
<div class="oind">${esc(p.industry)} · ${esc(p.employees)} employees</div>
<div class="sbadges">${stackBadges(p.stack)}</div>
<div class="sbadges">${tags(p)}</div>
<div class="oai"><div class="oail">Conversation angle</div>${esc(truncate(p.angle, 26))}</div>
</div>`;
}).join("") : `<div class="empty">No guests match.</div>`;
}
function idFromHash() {
const m = /^#guest-(\d+)$/.exec(location.hash);
return m && PEOPLE[+m[1]] ? +m[1] : null;
}
function currentId() { const i = idFromHash(); return i === null ? 0 : i; }
function show(view) {
const detail = view === "detail";
document.getElementById("ov").style.display   = detail ? "none" : "block";
document.getElementById("fbar").style.display = detail ? "none" : "flex";
document.getElementById("sbar").style.display = detail ? "none" : "block";
document.getElementById("dv").style.display   = detail ? "block" : "none";
document.querySelector(".hdr").style.display = detail ? "none" : "block";
}
let pendingDir = 0;
function openDetail(id) { pendingDir = 0; location.hash = "guest-" + id; }
function goHome() { location.hash = "all"; }
function goDetail(id, dir) { pendingDir = dir; location.hash = "guest-" + id; }
function navigate(d) { goDetail((currentId() + d + PEOPLE.length) % PEOPLE.length, d); }
function route() {
const id = idFromHash();
if (id === null) { show("home"); document.title = "Bedrock Data · Palo Alto CISO Dinner Brief"; return; }
show("detail"); renderDetail(id); window.scrollTo(0, 0);
const db = document.getElementById("db");
db.classList.remove("slide-from-right", "slide-from-left");
if (pendingDir) { void db.offsetWidth; db.classList.add(pendingDir > 0 ? "slide-from-right" : "slide-from-left"); }
pendingDir = 0;
}
window.addEventListener("hashchange", route);
function renderDetail(id) {
const p = PEOPLE[id];
document.title = `${p.name} · Palo Alto Brief`;
const section = (t, html) => `<div class="sec"><div class="stit">${t}</div>${html}</div>`;
const bullets = arr => `<ul class="bl">${arr.map(b => `<li>${esc(b)}</li>`).join("")}</ul>`;
const prose = t => t.split("\n\n").map(x => `<p class="dprosa">${esc(x)}</p>`).join("");
const meta = [p.industry, p.employees ? `${p.employees} employees` : "", p.ae ? `AE: ${p.ae}` : ""].filter(Boolean).join(" · ");
document.getElementById("db").innerHTML = `
${p.sf ? `<div class="relbanner"><b>★ Returning guest</b> Attended the June SF dinner.</div>` : ""}
<div class="ch">
${avatar(p, 72)}
<div class="di">
<div class="dn">${esc(p.name)}</div>
<div class="dt">${esc(p.title)}</div>
<div class="dc">${esc(p.company)}</div>
<div class="dbadges">${tags(p)}</div>
<div class="dbadges">${stackBadges(p.stack)}</div>
<div class="cstats">${esc(meta)}</div>
${p.li ? `<a class="lil" href="${esc(p.li)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : ""}
</div>
</div>
${section("Conversation angle", `<div class="anglebox">${esc(p.angle)}</div>`)}
${section("Background", bullets(p.whoTheyAre))}

(function () {
let sx = 0, sy = 0;
const el = document.getElementById("dv");
el.addEventListener("touchstart", e => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY; }, { passive: true });
el.addEventListener("touchend", e => {
const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
navigate(dx < 0 ? 1 : -1);
}, { passive: true });
})();

renderOverview();
